<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workouts - Solo Leveling</title>

    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Inter:wght@400&family=Rubik:ital,wght@0,300..900;1,300..900&family=Stick+No+Bills:wght@742&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="Workouts.html" aria-current="page">Workouts</a>
      <a href="Tracker.html">Tracker</a>
      <a href="Calories.html">Calories</a>
      <a href="login.html" id="loginNavLink">Login</a>
      <a href="profile.html" id="profileNavLink" style="display: none;">Profile</a>
    </nav>

    <main class="page-wrap">
      <section class="form" id="workoutGenerator">
        <p id="heading">Workout Generator</p>

        <div class="field">
          <select id="goalInput" class="login-field" required>
            <option value="">Select Goal</option>
            <option value="gain">Gain Muscle</option>
            <option value="lose">Lose Weight</option>
            <option value="maintain">Maintain</option>
          </select>
        </div>

        <div class="field">
          <select id="experienceInput" class="login-field" required>
            <option value="">Select Experience</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
          </select>
        </div>

        <div class="field">
          <select id="equipmentInput" class="login-field" required>
            <option value="">Select Equipment</option>
            <option value="bodyweight">Bodyweight</option>
            <option value="dumbbell">Dumbbells</option>
            <option value="barbell">Barbell</option>
            <option value="machine">Machines</option>
            <option value="gym">Full Gym</option>
          </select>
        </div>

        <p id="workoutMessage" class="message" aria-live="polite"></p>

        <div class="btn">
          <button class="button1" id="generateWorkoutBtn" type="button">
            Generate Workout
          </button>
          <button class="button2" id="clearWorkoutBtn" type="button">
            Clear
          </button>
        </div>
      </section>

      <section id="workoutResults" class="workout-results"></section>

      <div class="btn">
        <button class="button1" id="completeWorkoutBtn" type="button">
          Complete Workout
        </button>
      </div>

      <p id="completeWorkoutMessage" class="message" aria-live="polite"></p>
    </main>

    <script src="nav.js"></script>
    <script src="workouts.js"></script>
  </body>
</html>
