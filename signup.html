<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Solo Leveling</title>

  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Inter:wght@400&family=Rubik:ital,wght@0,300..900;1,300..900&family=Stick+No+Bills:wght@742&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="Workouts.html">Workouts</a>
    <a href="Tracker.html">Tracker</a>
    <a href="Calories.html">Calories</a>
    <a href="login.html">Login</a>
  </nav>

  <form class="form" id="signupForm" novalidate>
    <p id="heading">Sign Up</p>

    <div class="field">
      <input id="signupUsername" name="username" placeholder="Username" class="login-field" type="text" required>
    </div>

    <div class="field">
      <input id="signupPassword" name="password" placeholder="Password" class="login-field" type="password" required>
    </div>

    <div class="field">
      <input id="signupConfirmPassword" name="confirmPassword" placeholder="Confirm Password" class="login-field" type="password" required>
    </div>

    <div class="field">
      <input id="signupAge" name="age" placeholder="Age" class="login-field" type="number" min="13" max="100" required>
    </div>

    <div class="field">
      <select id="signupSex" name="sex" class="login-field" required>
        <option value="">Select Sex</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="field">
      <select id="signupGoal" name="goal" class="login-field" required>
        <option value="">Select Goal</option>
        <option value="lose weight">Lose Weight</option>
        <option value="maintain">Maintain</option>
        <option value="gain muscle">Gain Muscle</option>
      </select>
    </div>

    <p id="signupMessage" class="message" aria-live="polite"></p>

    <div class="btn">
      <button class="button1" type="submit">Create Account</button>
      <button class="button2" type="button" id="backToLoginBtn">Back to Login</button>
    </div>
  </form>

  <script src="signup.js"></script>
</body>
</html>
